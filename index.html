<html lang="pt-BR">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Paradas Reais | Lima</title>
    
    <!-- Ícone Favicon SVG (Caminhão Laranja + E.L) -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23f97316'/><path d='M20 55 h35 v-20 h-20 l-10 10 z' fill='%23ffffff'/><circle cx='30' cy='60' r='6' fill='%230f172a'/><circle cx='50' cy='60' r='6' fill='%230f172a'/><text x='62' y='52' font-family='sans-serif' font-weight='900' font-size='22' fill='%23ffffff'>E.L</text></svg>">

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ea580c">
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        :root {
            --bg-color: #0b132b;
            --card-bg: #1c2541;
            --text-color: #ffffff;
            --border-color: #3a506b;
            --accent-color: #ff6b00;
            --accent-glow: rgba(255, 107, 0, 0.4);
            --subtext: #a0aec0;
            --box-bg: #0b132b;
        }

        body.theme-sol {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #0f172a;
            --border-color: #cbd5e1;
            --accent-color: #ea580c;
            --accent-glow: rgba(234, 88, 12, 0.25);
            --subtext: #64748b;
            --box-bg: #f1f5f9;
        }

        body.theme-oled {
            --bg-color: #000000;
            --card-bg: #111111;
            --text-color: #ffffff;
            --border-color: #262626;
            --accent-color: #ff5500;
            --accent-glow: rgba(255, 85, 0, 0.5);
            --subtext: #888888;
            --box-bg: #000000;
        }

        * { 
            box-sizing: border-box; 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
            transition: background-color 0.2s, color 0.2s;
        }
        
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
        }

        body {
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .main-wrapper {
            width: 100%;
            max-width: 420px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 10px 12px;
        }

        /* Seletor de Temas */
        .theme-bar {
            display: flex;
            gap: 4px;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 4px;
            margin-bottom: 8px;
        }
        .theme-btn {
            flex: 1;
            background: none;
            border: none;
            color: var(--subtext);
            padding: 6px 2px;
            font-size: 0.72rem;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
        }
        .theme-btn.active {
            background-color: var(--accent-color);
            color: #ffffff;
            box-shadow: 0 0 10px var(--accent-glow);
        }

        /* Cartão Principal */
        .card { 
            background-color: var(--card-bg); 
            padding: 14px; 
            border-radius: 16px; 
            border: 1px solid var(--border-color); 
            box-shadow: 0 8px 25px rgba(0,0,0,0.25);
        }
        
        .header {
            text-align: center;
            margin-bottom: 10px;
        }
        .creator-tag {
            display: inline-block;
            background: linear-gradient(135deg, #ff6b00, #ff0055);
            color: #ffffff;
            font-size: 0.68rem;
            font-weight: 900;
            padding: 3px 12px;
            border-radius: 20px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            box-shadow: 0 0 12px var(--accent-glow);
            margin-bottom: 4px;
        }
        h1 { 
            font-size: 1.15rem; 
            margin: 2px 0 0 0; 
            font-weight: 800;
            letter-spacing: -0.3px;
        }

        /* Botão de Upload Destacado */
        .btn-upload { 
            background: linear-gradient(135deg, var(--accent-color), #dc2626); 
            color: #ffffff; 
            padding: 12px; 
            border-radius: 12px; 
            cursor: pointer; 
            font-weight: 800; 
            font-size: 0.88rem;
            display: block; 
            text-align: center; 
            width: 100%; 
            box-shadow: 0 4px 15px var(--accent-glow);
            border: none;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .btn-upload:active { transform: scale(0.98); }
        .file-input { display: none; }
        
        .file-info-badge {
            display: none;
            background-color: var(--box-bg);
            border: 1px dashed var(--accent-color);
            border-radius: 8px;
            padding: 6px;
            margin-top: 8px;
            font-size: 0.7rem;
            color: var(--subtext);
            text-align: center;
        }
        .file-info-badge strong { color: var(--text-color); }

        /* Resultados */
        .results-grid { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 8px; 
            margin-top: 10px; 
        }
        .result-box { 
            background-color: var(--box-bg); 
            padding: 8px; 
            border-radius: 12px; 
            border: 1px solid var(--border-color); 
            text-align: center;
        }
        .result-box .number { 
            font-size: 1.7rem; 
            font-weight: 900; 
            color: var(--accent-color); 
            line-height: 1.1;
            margin-top: 2px;
        }
        .lbl-result { 
            font-size: 0.65rem; 
            color: var(--subtext); 
            text-transform: uppercase; 
            font-weight: 800;
        }

        /* Bairros */
        .bairros-section {
            margin-top: 10px;
            display: none;
        }
        .bairros-title {
            font-size: 0.72rem;
            font-weight: 800;
            color: var(--text-color);
            margin-bottom: 6px;
        }
        .bairros-list {
            display: flex;
            flex-direction: column;
            gap: 4px;
            max-height: 90px;
            overflow-y: auto;
            padding-right: 2px;
        }
        .bairro-item {
            background-color: var(--box-bg);
            border: 1px solid var(--border-color);
            padding: 5px 8px;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.7rem;
        }
        .bairro-name { font-weight: 600; }
        .bairro-count { 
            background-color: var(--accent-color); 
            color: #fff; 
            padding: 1px 6px; 
            border-radius: 8px; 
            font-weight: 800; 
            font-size: 0.65rem;
        }

        /* Banner PWA de Instalação Direta */
        .pwa-card {
            display: none; /* Escondido por padrão até o sistema autorizar */
            background: linear-gradient(135deg, rgba(255, 107, 0, 0.15), rgba(255, 0, 85, 0.1));
            border: 1px solid var(--accent-color);
            border-radius: 14px;
            padding: 10px 12px;
            margin-top: 10px;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            box-shadow: 0 4px 12px var(--accent-glow);
        }
        .pwa-info {
            text-align: left;
        }
        .pwa-title {
            font-weight: 800;
            font-size: 0.75rem;
            color: var(--text-color);
        }
        .pwa-sub {
            font-size: 0.65rem;
            color: var(--subtext);
            margin-top: 1px;
        }
        .btn-pwa-install {
            background-color: var(--accent-color);
            color: #ffffff;
            border: none;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 0.72rem;
            font-weight: 800;
            cursor: pointer;
            white-space: nowrap;
            box-shadow: 0 2px 8px var(--accent-glow);
        }
        .btn-pwa-install:active { transform: scale(0.95); }

        /* Rodapé de Assinatura Sempre Visível */
        .footer {
            margin-top: 12px;
            padding: 8px 0 4px 0;
            text-align: center;
            font-size: 0.68rem;
            color: var(--subtext);
            border-top: 1px solid var(--border-color);
        }
        .footer-title {
            font-weight: 800;
            color: var(--text-color);
        }
        .footer-contact {
            margin-top: 3px;
            font-weight: 700;
        }
        .footer-contact a {
            color: var(--accent-color);
            text-decoration: none;
        }
    </style>
</head>
<body>

    <div class="main-wrapper">
        <div>
            <!-- Seletor de Tema -->
            <div class="theme-bar">
                <button class="theme-btn active" id="btnThemeDark" onclick="setTheme('dark')">🌙 Noite</button>
                <button class="theme-btn" id="btnThemeSol" onclick="setTheme('sol')">☀️ Sol (Dia)</button>
                <button class="theme-btn" id="btnThemeOled" onclick="setTheme('oled')">⚡ Bateria</button>
            </div>

            <!-- Card Principal -->
            <div class="card">
                <div class="header">
                    <div class="creator-tag">⚡ Criado por Lima</div>
                    <h1>Calculadora de paradas reais</h1>
                </div>

                <label for="excelFile" class="btn-upload">📙 Enviar Planilha Shopee</label>
                <input type="file" id="excelFile" class="file-input" accept=".xlsx, .xls, .csv">

                <div id="fileInfo" class="file-info-badge">
                    📄 <strong id="fileName">-</strong> | 🕒 <span id="fileTime">-</span>
                </div>

                <div class="results-grid">
                    <div class="result-box">
                        <div class="lbl-result">Total Pacotes</div>
                        <div class="number" id="totalPacotes">0</div>
                    </div>
                    <div class="result-box">
                        <div class="lbl-result">Paradas Reais</div>
                        <div class="number" id="paradasReais">0</div>
                    </div>
                </div>

                <div id="bairrosSection" class="bairros-section">
                    <div class="bairros-title">📍 Paradas Reais por Bairro:</div>
                    <div id="bairrosList" class="bairros-list"></div>
                </div>
            </div>

            <!-- Card de Atalho para Tela Inicial (Só exibe se o Android liberar o clique único) -->
            <div id="pwaCard" class="pwa-card">
                <div class="pwa-info">
                    <div class="pwa-title">📲 Adicionar atalho ao celular?</div>
                    <div class="pwa-sub">Confirme para ter o ícone E.L na aba inicial.</div>
                </div>
                <button class="btn-pwa-install" id="btnInstallPwa" onclick="installPwa()">ADICIONAR</button>
            </div>
        </div>

        <!-- Rodapé Fixo e Visível -->
        <footer class="footer">
            <div class="footer-title">Calculadora de paradas reais | Desenvolvido por Lima 🧡</div>
            <div class="footer-contact">Contato/Suporte: <a href="tel:85991562339">85 99156-2339</a></div>
        </footer>
    </div>

    <script>
        function setTheme(theme) {
            document.body.className = '';
            document.querySelectorAll('.theme-btn').forEach(b => b.classList.remove('active'));
            if (theme === 'sol') {
                document.body.classList.add('theme-sol');
                document.getElementById('btnThemeSol').classList.add('active');
            } else if (theme === 'oled') {
                document.body.classList.add('theme-oled');
                document.getElementById('btnThemeOled').classList.add('active');
            } else {
                document.getElementById('btnThemeDark').classList.add('active');
            }
            localStorage.setItem('lima_theme', theme);
        }
        
        const savedTheme = localStorage.getItem('lima_theme') || 'dark';
        setTheme(savedTheme);

        function loadSavedData() {
            const savedData = localStorage.getItem('lima_last_calc');
            if (savedData) {
                const data = JSON.parse(savedData);
                renderResults(data.total, data.paradas, data.bairros, data.fileName, data.time);
            }
        }

        document.getElementById('excelFile').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(evt) {
                const data = new Uint8Array(evt.target.result);
                const workbook = XLSX.read(data, { type: 'array' });
                const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
                const rows = XLSX.utils.sheet_to_json(firstSheet, { defval: "" });

                if (rows.length === 0) {
                    alert("A planilha selecionada está vazia!");
                    return;
                }

                const colunas = Object.keys(rows[0]);
                const colEndereco = colunas.find(c => /destination address|endereço|endereco|logradouro|rua/i.test(c)) || colunas[0];
                const colBairro = colunas.find(c => /bairro|district|neighborhood/i.test(c));

                const paradasUnicas = new Set();
                const bairrosMap = {}; 
                let totalPacotes = 0;

                rows.forEach(row => {
                    let enderecoBruto = String(row[colEndereco] || "").trim();

                    if (enderecoBruto) {
                        totalPacotes++;

                        let partes = enderecoBruto.split(',');
                        let rua = partes[0] ? partes[0].toLowerCase().trim() : "";
                        let complementoNum = partes[1] ? partes[1].toLowerCase().trim() : "";

                        rua = rua.replace(/\b(r|rua)\b/g, "rua")
                                 .replace(/\b(av|avenida)\b/g, "avenida")
                                 .replace(/\b(pça|praça)\b/g, "praça")
                                 .replace(/\s+/g, " ")
                                 .trim();

                        let numMatch = complementoNum.match(/\d+/);
                        let numeroLimpo = "";

                        if (numMatch) {
                            numeroLimpo = numMatch[0];
                        } else {
                            let numNaRua = rua.match(/\b\d+\b/);
                            if (numNaRua) {
                                numeroLimpo = numNaRua[0];
                                rua = rua.replace(/\b\d+\b/g, "").trim();
                            }
                        }

                        let chaveParada = `${rua}___${numeroLimpo}`;

                        if (!paradasUnicas.has(chaveParada)) {
                            paradasUnicas.add(chaveParada);
                            
                            let bairroNome = colBairro ? String(row[colBairro] || "").trim() : "Outros";
                            if (!bairroNome) bairroNome = "Outros";

                            bairrosMap[bairroNome] = (bairrosMap[bairroNome] || 0) + 1;
                        }
                    }
                });

                const horaAtual = new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
                
                const payload = {
                    total: totalPacotes,
                    paradas: paradasUnicas.size,
                    bairros: bairrosMap,
                    fileName: file.name,
                    time: horaAtual
                };
                localStorage.setItem('lima_last_calc', JSON.stringify(payload));

                renderResults(totalPacotes, paradasUnicas.size, bairrosMap, file.name, horaAtual);
            };

            reader.readAsArrayBuffer(file);
        });

        function renderResults(total, paradas, bairros, fileName, time) {
            document.getElementById('totalPacotes').innerText = total;
            document.getElementById('paradasReais').innerText = paradas;
            document.getElementById('fileName').innerText = fileName;
            document.getElementById('fileTime').innerText = time;
            document.getElementById('fileInfo').style.display = 'block';

            const bairrosList = document.getElementById('bairrosList');
            bairrosList.innerHTML = '';
            
            const bairrosOrdenados = Object.keys(bairros).sort((a,b) => bairros[b] - bairros[a]);

            if (bairrosOrdenados.length > 0) {
                bairrosOrdenados.forEach(bairro => {
                    const item = document.createElement('div');
                    item.className = 'bairro-item';
                    item.innerHTML = `<span class="bairro-name">${bairro}</span> <span class="bairro-count">${bairros[bairro]} paradas</span>`;
                    bairrosList.appendChild(item);
                });
                document.getElementById('bairrosSection').style.display = 'block';
            }
        }

        loadSavedData();

        // --- REGISTRO DO SERVICE WORKER E INSTALAÇÃO DIRETA NATIVA ---
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }

        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            // Exibe o cartão apenas quando a confirmação automática do Android estiver pronta!
            document.getElementById('pwaCard').style.display = 'flex';
        });

        function installPwa() {
            if (deferredPrompt) {
                deferredPrompt.prompt(); // Dispara o popup nativo de Sim/Não do Android
                deferredPrompt.userChoice.then((choiceResult) => {
                    if (choiceResult.outcome === 'accepted') {
                        document.getElementById('pwaCard').style.display = 'none';
                    }
                    deferredPrompt = null;
                });
            }
        }
    </script>
</body>
</html>
